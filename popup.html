<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>クイック翻訳</title>
<style>
  :root{--fg:#1f2328;--muted:#59636e;--line:#d0d7de;--accent:#1a73e8;--bg:#fff}
  @media (prefers-color-scheme:dark){:root{--fg:#e6edf3;--muted:#9198a1;--line:#3d444d;--accent:#4493f8;--bg:#16181c}}
  body{width:260px;margin:0;padding:14px 16px;font:14px/1.6 system-ui,"Yu Gothic UI","Yu Gothic",sans-serif;color:var(--fg);background:var(--bg)}
  h1{display:flex;align-items:center;gap:8px;font-size:15px;margin:0 0 10px}
  h1 img{width:20px;height:20px}
  #site{font-weight:600;word-break:break-all;margin:0}
  #state{color:var(--muted);font-size:12px;margin:2px 0 10px}
  button{display:block;width:100%;box-sizing:border-box;padding:6px 10px;margin-top:8px;border:1px solid var(--accent);border-radius:6px;background:var(--accent);color:#fff;cursor:pointer;font:inherit}
  button.sub{background:transparent;color:var(--accent)}
  button[hidden]{display:none}
</style>
</head>
<body>
<h1><img src="icons/icon32.png" alt="">クイック翻訳</h1>
<p id="site"></p>
<p id="state"></p>
<button id="pause" hidden></button>
<button id="settings" class="sub">設定</button>
<script src="popup.js"></script>
</body>
</html>
