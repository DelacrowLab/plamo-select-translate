<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4c8df6"/>
      <stop offset="1" stop-color="#1a5fd6"/>
    </linearGradient>
  </defs>
  <!-- 16px 用: 細部を省き「あ」だけ大きく -->
